<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Footnotes" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.png" />
    <title>Footnotes</title>
    <style>
      :root {
        --bg: #e7e2d6;
        --surface: #efece3;
        --pill: #dcd5c7;
        --text: #221e1a;
        --muted: #766f64;
        --hairline: rgba(58, 49, 38, 0.14);
        --accent: #584c3f;
        --serif: Georgia, "New York", "Times New Roman", serif;
        --mono:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        padding-top: env(safe-area-inset-top);
        padding-bottom: calc(96px + env(safe-area-inset-bottom));
        min-height: 100vh;
      }

      /* Header */
      header {
        position: sticky;
        top: 0;
        z-index: 15;
        background: rgba(231, 226, 214, 0.94);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 14px 20px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand-cluster {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-badge {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--pill);
        border: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: var(--text);
      }

      header h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.2px;
        line-height: 1.2;
      }

      .header-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 1px;
      }

      .pill-controls {
        display: flex;
        align-items: center;
        background: var(--pill);
        border: 1px solid var(--hairline);
        border-radius: 999px;
        padding: 3px;
      }

      .pill-controls button {
        background: none;
        border: none;
        color: var(--text);
        padding: 6px 11px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .pill-controls .sep {
        width: 1px;
        height: 16px;
        background: var(--hairline);
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 6px 20px 20px;
      }

      .view {
        display: none;
      }
      .view.active {
        display: block;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 14px;
      }

      .row-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .serif {
        font-family: var(--serif);
      }
      .mono {
        font-family: var(--mono);
      }
      .muted {
        color: var(--muted);
      }

      /* Shared Period Navigation */
      .period-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }

      .period-nav-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--hairline);
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .period-label {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        text-align: center;
      }

      /* ================= JOURNAL (FIELD NOTES STYLE) ================= */
      .date-strip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 6px 0 14px;
      }

      .month-btn {
        background: none;
        border: none;
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        font-weight: 500;
        padding: 6px 4px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }

      .days-row {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        flex: 1;
        text-align: center;
        gap: 2px;
      }

      .day-pill {
        background: none;
        border: 1.5px solid transparent;
        border-radius: 12px;
        padding: 6px 0 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        color: var(--muted);
        font-family: var(--sans);
        font-size: 14px;
        font-weight: 500;
      }

      .day-pill.selected {
        background: var(--pill);
        border-color: var(--accent);
        color: var(--text);
        font-weight: 600;
      }

      .day-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: transparent;
      }

      .day-pill.has-notes .day-dot {
        background: var(--text);
      }

      .day-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 4px 0 18px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      .day-divider::before,
      .day-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--hairline);
      }

      .timeline-row {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 10px;
        margin-bottom: 24px;
        align-items: start;
      }

      .time-col {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        padding-top: 3px;
      }

      .canvas-editor {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        color: var(--text);
        font-family: var(--mono);
        font-size: 16px;
        line-height: 1.6;
        padding: 0;
        min-height: 54px;
      }

      .canvas-editor::placeholder {
        color: var(--muted);
        opacity: 0.75;
      }

      .canvas-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--hairline);
      }

      .canvas-photo-preview {
        position: relative;
        display: inline-block;
        margin: 8px 0 4px;
      }

      .canvas-photo-preview img,
      .entry-photo {
        display: block;
        width: 100%;
        max-width: 270px;
        border-radius: 14px;
        border: 1px solid var(--hairline);
        margin-bottom: 10px;
      }

      .remove-photo-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: none;
        background: rgba(34, 30, 26, 0.78);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }

      .entry-body {
        font-family: var(--mono);
        font-size: 15px;
        line-height: 1.6;
        color: var(--text);
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .entry-actions {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 10px;
      }

      .entry-actions button {
        background: none;
        border: none;
        padding: 2px 0;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .journal-bottom-bar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(68px + env(safe-area-inset-bottom));
        width: calc(100% - 40px);
        max-width: 600px;
        display: none;
        align-items: center;
        gap: 10px;
        z-index: 18;
      }

      .journal-bottom-bar.show {
        display: flex;
      }

      .new-note-pill {
        flex: 1;
        height: 48px;
        border-radius: 999px;
        border: none;
        background: var(--accent);
        color: #faf7f0;
        font-family: var(--sans);
        font-size: 15px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 6px 18px rgba(34, 30, 26, 0.16);
        cursor: pointer;
      }

      .search-circle-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid var(--hairline);
        background: var(--pill);
        color: var(--text);
        font-size: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(34, 30, 26, 0.08);
        cursor: pointer;
        flex-shrink: 0;
      }

      .search-bar-inline {
        display: none;
        margin-bottom: 14px;
      }

      .search-bar-inline.open {
        display: block;
      }

      /* ================= TASKS + SNOOPY + WEEK PLANNER ================= */
      .snoopy-card {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 16px;
        padding: 16px 16px 12px;
        margin-bottom: 14px;
      }

      .snoopy-stage {
        position: relative;
        height: 76px;
        margin-top: 10px;
        overflow: hidden;
      }

      .snoopy-ground {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 8px;
        height: 2px;
        background: repeating-linear-gradient(
          to right,
          var(--accent) 0px,
          var(--accent) 6px,
          transparent 6px,
          transparent 11px
        );
        opacity: 0.45;
      }

      .snoopy-track-fill {
        position: absolute;
        left: 12px;
        bottom: 8px;
        height: 2px;
        background: var(--accent);
        transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .doghouse-goal {
        position: absolute;
        right: 10px;
        bottom: 8px;
        width: 46px;
        height: 54px;
      }

      .snoopy-walker {
        position: absolute;
        bottom: 7px;
        left: 8px;
        width: 46px;
        height: 52px;
        transition: left 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        transform-origin: bottom center;
      }

      .snoopy-walker.walking {
        animation: snoopyStride 0.45s ease-in-out 2;
      }

      .snoopy-walker.celebrate {
        animation: snoopyHappy 0.6s ease-in-out infinite alternate;
      }

      .snoopy-heart {
        position: absolute;
        top: -8px;
        right: 2px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .snoopy-walker.celebrate .snoopy-heart {
        opacity: 1;
      }

      @keyframes snoopyStride {
        0% {
          transform: translateY(0) rotate(0deg);
        }
        25% {
          transform: translateY(-5px) rotate(-4deg);
        }
        50% {
          transform: translateY(0) rotate(2deg);
        }
        75% {
          transform: translateY(-4px) rotate(-3deg);
        }
        100% {
          transform: translateY(0) rotate(0deg);
        }
      }

      @keyframes snoopyHappy {
        0% {
          transform: translateY(0) scale(1);
        }
        100% {
          transform: translateY(-6px) scale(1.04);
        }
      }

      .quick-add-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 14px;
        padding: 6px 8px 6px 14px;
        margin-bottom: 12px;
      }

      .quick-add-bar input[type="text"] {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: var(--mono);
        font-size: 16px;
        padding: 6px 0;
      }

      .quick-add-bar input[type="text"]::placeholder {
        color: var(--muted);
      }

      .date-chip-input {
        background: var(--pill);
        border: 1px solid var(--hairline);
        border-radius: 10px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 8px;
        max-width: 118px;
        flex-shrink: 0;
      }

      .quick-plus-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #faf7f0;
        font-size: 20px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: var(--pill);
        padding: 3px;
        border-radius: 10px;
        margin-bottom: 12px;
      }

      .segmented.two-col {
        grid-template-columns: repeat(2, 1fr);
      }

      .segmented button {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 7px 0;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .segmented button.active {
        background: var(--surface);
        color: var(--text);
        font-weight: 600;
      }

      .task-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 4px;
        border-bottom: 1px solid var(--hairline);
      }

      .task-item:last-child {
        border-bottom: none;
      }

      .check-circle {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1.5px solid var(--accent);
        background: none;
        flex-shrink: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #faf7f0;
        font-size: 12px;
      }

      .check-circle.done {
        background: var(--accent);
      }

      .task-title {
        font-family: var(--mono);
        font-size: 15px;
        flex: 1;
        word-break: break-word;
      }

      .task-title.done {
        text-decoration: line-through;
        color: var(--muted);
      }

      /* Task Week Strip & Day Blocks */
      .task-week-strip {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
        margin-bottom: 14px;
      }

      .task-day-cell {
        background: var(--surface);
        border: 1.5px solid var(--hairline);
        border-radius: 12px;
        padding: 8px 2px 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        cursor: pointer;
        color: var(--muted);
        font-family: var(--mono);
      }

      .task-day-cell.today {
        border-color: rgba(88, 76, 63, 0.45);
      }

      .task-day-cell.selected {
        background: var(--accent);
        border-color: var(--accent);
        color: #faf7f0;
      }

      .task-day-badge {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 99px;
        background: var(--pill);
        color: var(--text);
        min-height: 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .task-day-cell.selected .task-day-badge {
        background: rgba(250, 247, 240, 0.22);
        color: #faf7f0;
      }

      .week-day-group {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }

      .week-day-group.active-day {
        border-color: var(--accent);
      }

      .week-day-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        cursor: pointer;
      }

      /* ================= HABITS (WEEK / MONTH / YEAR) ================= */
      .progress-track {
        height: 6px;
        background: var(--hairline);
        border-radius: 99px;
        overflow: hidden;
        margin: 12px 0;
      }

      .progress-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 99px;
        transition: width 0.25s ease;
      }

      .week-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        margin-top: 12px;
      }

      .day-btn {
        background: var(--bg);
        border: 1px solid var(--hairline);
        border-radius: 8px;
        padding: 8px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
      }

      .day-btn.today {
        border-color: var(--accent);
      }
      .day-btn.done {
        background: var(--accent);
        border-color: var(--accent);
        color: #faf7f0;
      }

      /* Habit Month Calendar Grid */
      .month-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        margin-top: 12px;
        margin-bottom: 4px;
        text-align: center;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
      }

      .month-cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }

      .month-day-btn {
        aspect-ratio: 1 / 1;
        border-radius: 7px;
        border: 1px solid var(--hairline);
        background: var(--bg);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .month-day-btn.today {
        border-color: var(--accent);
        font-weight: 700;
        color: var(--text);
      }

      .month-day-btn.done {
        background: var(--accent);
        border-color: var(--accent);
        color: #faf7f0;
      }

      /* Habit Year Heatmap & 12-Month Bars */
      .year-heatmap-scroll {
        overflow-x: auto;
        padding: 6px 0 4px;
        -webkit-overflow-scrolling: touch;
      }

      .year-heatmap {
        display: grid;
        grid-template-rows: repeat(7, 10px);
        grid-auto-flow: column;
        grid-auto-columns: 10px;
        gap: 3px;
        width: max-content;
      }

      .heat-cell {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: rgba(58, 49, 38, 0.08);
      }

      .heat-cell.l1 {
        background: rgba(88, 76, 63, 0.28);
      }
      .heat-cell.l2 {
        background: rgba(88, 76, 63, 0.52);
      }
      .heat-cell.l3 {
        background: rgba(88, 76, 63, 0.78);
      }
      .heat-cell.l4 {
        background: #584c3f;
      }

      .year-bars {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 5px;
        align-items: end;
        height: 76px;
        margin-top: 14px;
        padding-top: 8px;
      }

      .year-bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        height: 100%;
        justify-content: flex-end;
      }

      .year-bar-track {
        width: 100%;
        height: 54px;
        background: var(--bg);
        border: 1px solid var(--hairline);
        border-radius: 5px;
        display: flex;
        align-items: flex-end;
        overflow: hidden;
      }

      .year-bar-fill {
        width: 100%;
        background: var(--accent);
        border-radius: 4px 4px 0 0;
        transition: height 0.3s ease;
      }

      .year-bar-label {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--muted);
      }

      /* Bottom Tab Navigation */
      nav.tabs {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(239, 236, 227, 0.96);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--hairline);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding-bottom: env(safe-area-inset-bottom);
        z-index: 20;
      }

      nav.tabs button {
        background: none;
        border: none;
        padding: 10px 0 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        cursor: pointer;
      }

      nav.tabs button.active {
        color: var(--accent);
        font-weight: 600;
      }

      nav.tabs button span.icon {
        font-size: 17px;
      }

      /* Shared Buttons & Backup Drawer */
      .btn-primary {
        background: var(--accent);
        color: #faf7f0;
        border: none;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .btn-ghost {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 14px;
        cursor: pointer;
        padding: 4px 8px;
      }

      .btn-danger {
        background: none;
        border: none;
        color: #9e3b33;
        font-size: 13px;
        cursor: pointer;
      }

      .empty {
        text-align: center;
        padding: 32px 12px;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
      }

      .backup-panel {
        display: none;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 16px;
        padding: 16px;
        margin: 8px auto 12px;
        width: calc(100% - 40px);
        max-width: 600px;

      .backup-panel.open {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand-cluster">

    <!-- Inline Backup Drawer -->

    <main>
      <!-- ================= JOURNAL VIEW (FIELD NOTES) ================= -->

        <div class="day-divider" id="journalDayDivider">TODAY</div>

        <!-- Inline Canvas Composer -->
        <div class="timeline-row" id="inlineComposerRow">

      <!-- ================= TASKS VIEW (TODAY + WEEK SCHEDULER) ================= -->

          <!-- Inline Quick-Add with Optional Schedule Date -->
          <div class="quick-add-bar">
            <input
              type="text"

              onkeydown="if (event.key === 'Enter') addQuickTask();"

        <!-- WEEK PLANNER SUB-VIEW -->

      <!-- ================= HABITS VIEW (WEEK / MONTH / YEAR) ================= -->
      <section id="view-habits" class="view">

    <!-- Floating Field Notes Pill Bar (Journal Tab Only) -->
    <div class="journal-bottom-bar show" id="journalBottomBar">
      <button class="new-note-pill" onclick="focusInlineComposer()">

        <span>new note</span>
      </button>

        class="search-circle-btn"
        onclick="toggleJournalSearch()"
        title="Search Notes"
      >
        ⌕
      </button>
    </div>

    <!-- Bottom Tab Navigation -->
    <nav class="tabs">
      <button class="active" data-tab="journal">
        <span class="icon">¶</span>Journal
      </button>
      <button data-tab="tasks"><span class="icon">☑</span>Tasks</button>
      <button data-tab="habits"><span class="icon">▤</span>Habits</button>
    </nav>

    <script>
      const STORAGE_KEY = "footnotes_life_v1";
      let state = JSON.parse(
        localStorage.getItem(STORAGE_KEY) ||
          '{"habits":[],"tasks":[],"journal":[]}',
      );

      let currentTab = "journal";

      // Journal state
      let selectedJournalDate = dayKey(new Date());
      let pendingPhotoDataUrl = null;
      let editingNoteId = null;

      // Tasks state
      let taskMode = "today"; // "today" | "week"
      let taskFilter = "all";
      let taskWeekOffset = 0;
      let selectedTaskWeekDate = dayKey(new Date());
      let lastTaskCountDone = -1;

      // Habits state
      let habitMode = "week"; // "week" | "month" | "year"
      let habitWeekOffset = 0;
      let habitMonthOffset = 0;
      let habitYearOffset = 0;

      function dayKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function parseDayKey(key) {
        const [y, m, d] = key.split("-").map(Number);
        return new Date(y, m - 1, d);
      }

      function syncDailyTasks() {
        const today = dayKey(new Date());
        let changed = false;
        state.tasks.forEach((t) => {
          if (!t.date) {
            t.date = today;
            changed = true;
          } else if (!t.done && t.date < today) {
            // Carry uncompleted past tasks forward to today; keep future tasks on their scheduled dates
            t.date = today;
            changed = true;
          }
        });
        if (changed) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }
      }

      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        render();
      }

      function getWeekForDate(baseDate) {
        const day = baseDate.getDay();
        const diffToMon = day === 0 ? -6 : 1 - day;
        const mon = new Date(baseDate);
        mon.setDate(baseDate.getDate() + diffToMon);
        const days = [];
        const labels = ["M", "T", "W", "T", "F", "S", "S"];
        const shortNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        const todayStr = dayKey(new Date());
        for (let i = 0; i < 7; i++) {
          const d = new Date(mon);
          d.setDate(mon.getDate() + i);
          days.push({
            date: d,
            key: dayKey(d),
            label: labels[i],
            shortName: shortNames[i],
            isToday: dayKey(d) === todayStr,
          });
        }
        return days;
      }

      function getWeekByOffset(offsetWeeks) {
        const d = new Date();
        d.setDate(d.getDate() + offsetWeeks * 7);
        return getWeekForDate(d);
      }

      /* ================= JOURNAL ================= */
      function renderJournal() {
        const selDateObj = parseDayKey(selectedJournalDate);
        const week = getWeekForDate(selDateObj);
        const todayStr = dayKey(new Date());

        const monthShort = selDateObj.toLocaleDateString(undefined, {
          month: "short",
        });
        document.getElementById("monthLabelBtn").textContent =
          `${monthShort} ▾`;

        const daysWithNotes = new Set(
          state.journal.map((e) => dayKey(new Date(e.createdAt))),
        );

        document.getElementById("journalDaysRow").innerHTML = week
          .map((d) => {
            const isSel = d.key === selectedJournalDate;
            const hasNotes = daysWithNotes.has(d.key);
            return `
          <button
            class="day-pill ${isSel ? "selected" : ""} ${hasNotes ? "has-notes" : ""}"
            onclick="selectJournalDate('${d.key}')"
          >
            <span>${d.date.getDate()}</span>
            <span class="day-dot"></span>
          </button>
        `;
          })
          .join("");

        const divider = document.getElementById("journalDayDivider");
        divider.textContent =
          selectedJournalDate === todayStr
            ? "TODAY"
            : selDateObj
                .toLocaleDateString(undefined, {
                  weekday: "short",
                  month: "short",
                  day: "numeric",
                })
                .toUpperCase();

        const now = new Date();
        document.getElementById("liveClockLabel").textContent =
          now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          });

        const q = document
          .getElementById("journalSearchInput")
          .value.trim()
          .toLowerCase();
        const matchingEntries = state.journal.filter((e) => {
          if (q) {
            return (
              (e.body || "").toLowerCase().includes(q) ||
              (e.title || "").toLowerCase().includes(q)
            );
          }
          return dayKey(new Date(e.createdAt)) === selectedJournalDate;
        });

        if (currentTab === "journal") {
          const count = matchingEntries.length;
          document.getElementById("pageSubtitle").textContent =
            `${count} ${count === 1 ? "note" : "notes"}`;
        }

        const feed = document.getElementById("journalFeed");
        if (!matchingEntries.length) {
          feed.innerHTML = `<div class="empty">${q ? "No matching notes." : "No notes logged for this day yet."}</div>`;
          return;
        }

        feed.innerHTML = matchingEntries
          .map((e) => {
            const dt = new Date(e.createdAt);
            const timeStr = q
              ? dt.toLocaleDateString(undefined, {
                  month: "short",
                  day: "numeric",
                })
              : dt.toLocaleTimeString([], {
                  hour: "2-digit",
                  minute: "2-digit",
                  hour12: false,
                });

            if (editingNoteId === e.id) {
              return `
            <div class="timeline-row">
              <div class="time-col">${timeStr}</div>
              <div>
                <textarea id="editBox-${e.id}" class="canvas-editor" rows="3" oninput="autoGrow(this)">${escapeHtml(e.body)}</textarea>
                <div style="display:flex; gap:8px; margin-top:8px;">
                  <button class="btn-primary" onclick="commitEditNote('${e.id}')">Save</button>
                  <button class="btn-ghost" onclick="cancelEditNote()">Cancel</button>
                </div>
              </div>
            </div>
          `;
            }

            return `
          <article class="timeline-row">
            <div class="time-col">${timeStr}</div>
            <div>
              ${e.image ? `<img src="${e.image}" class="entry-photo" alt="Note attachment" />` : ""}
              ${e.title ? `<div style="font-weight:600; margin-bottom:4px;">${escapeHtml(e.title)}</div>` : ""}
              <p class="entry-body">${escapeHtml(e.body)}</p>
              <div class="entry-actions">
                <button onclick="startEditNote('${e.id}')">✎ Edit</button>
                <button onclick="deleteJournal('${e.id}')">••• Delete</button>
              </div>
            </div>
          </article>
        `;
          })
          .join("");
      }

      window.selectJournalDate = (key) => {
        selectedJournalDate = key;
        editingNoteId = null;
        renderJournal();
      };

      window.focusInlineComposer = () => {
        selectedJournalDate = dayKey(new Date());
        renderJournal();
        const box = document.getElementById("canvasInput");
        box.scrollIntoView({ behavior: "smooth", block: "center" });
        setTimeout(() => box.focus(), 180);
      };

      window.toggleJournalSearch = () => {
        const bar = document.getElementById("journalSearchBar");
        bar.classList.toggle("open");
        if (bar.classList.contains("open"))
          document.getElementById("journalSearchInput").focus();
        else clearJournalSearch();
      };

      window.clearJournalSearch = () => {
        document.getElementById("journalSearchInput").value = "";
        document.getElementById("journalSearchBar").classList.remove("open");
        renderJournal();
      };

      window.autoGrow = (el) => {
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
      };

      window.handleCanvasPhoto = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        compressImage(file, 800, 0.72, (dataUrl) => {
          pendingPhotoDataUrl = dataUrl;
          document.getElementById("canvasPhotoPreviewWrap").innerHTML = `
          <div class="canvas-photo-preview">
            <img src="${dataUrl}" alt="Preview" />
            <button class="remove-photo-btn" onclick="clearPendingPhoto()">×</button>
          </div>
        `;
        });
      };

      window.clearPendingPhoto = () => {
        pendingPhotoDataUrl = null;
        document.getElementById("canvasPhotoInput").value = "";
        document.getElementById("canvasPhotoPreviewWrap").innerHTML = "";
      };

      function compressImage(file, maxWidth, quality, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas
              .getContext("2d")
              .drawImage(img, 0, 0, canvas.width, canvas.height);
            callback(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      window.saveInlineNote = () => {
        const box = document.getElementById("canvasInput");
        const body = box.value.trim();
        if (!body && !pendingPhotoDataUrl) return;

        const todayStr = dayKey(new Date());
        let timestamp = new Date().toISOString();
        if (selectedJournalDate !== todayStr) {
          const d = parseDayKey(selectedJournalDate);
          const now = new Date();
          d.setHours(now.getHours(), now.getMinutes(), now.getSeconds());
          timestamp = d.toISOString();
        }

        state.journal.unshift({
          id: crypto.randomUUID(),
          title: "",
          body,
          image: pendingPhotoDataUrl || null,
          createdAt: timestamp,
        });

        box.value = "";
        box.style.height = "54px";
        clearPendingPhoto();
        save();
      };

      window.startEditNote = (id) => {
        editingNoteId = id;
        renderJournal();
        const box = document.getElementById(`editBox-${id}`);
        if (box) {
          autoGrow(box);
          box.focus();
        }
      };

      window.cancelEditNote = () => {
        editingNoteId = null;
        renderJournal();
      };

      window.commitEditNote = (id) => {
        const box = document.getElementById(`editBox-${id}`);
        if (!box) return;
        const updated = box.value.trim();
        const entry = state.journal.find((x) => x.id === id);
        if (entry && updated) entry.body = updated;
        editingNoteId = null;
        save();
      };

      window.deleteJournal = (id) => {
        state.journal = state.journal.filter((x) => x.id !== id);
        save();
      };

      /* ================= TASKS (TODAY + WEEK SCHEDULER) ================= */
      function renderTasks() {
        syncDailyTasks();
        const today = dayKey(new Date());

        document.getElementById("tasksTodayPane").style.display =
          taskMode === "today" ? "block" : "none";
        document.getElementById("tasksWeekPane").style.display =
          taskMode === "week" ? "block" : "none";

        // Keep quick date input defaulted to today if blank
        const quickDateEl = document.getElementById("quickTaskDate");
        if (!quickDateEl.value) quickDateEl.value = today;

        const todayTasks = state.tasks.filter((t) => t.date === today);
        const doneCount = todayTasks.filter((t) => t.done).length;
        const total = todayTasks.length;
        const ratio = total ? doneCount / total : 0;
        const pct = Math.round(ratio * 100);

        document.getElementById("taskDateLabel").textContent =
          new Date().toLocaleDateString(undefined, {
            month: "short",
            day: "numeric",
          });
        document.getElementById("taskCountLabel").textContent =
          `${doneCount} / ${total} (${pct}%)`;

        if (currentTab === "tasks") {
          if (taskMode === "today") {
            const upcomingCount = state.tasks.filter(
              (t) => t.date > today && !t.done,
            ).length;
            document.getElementById("pageSubtitle").textContent = upcomingCount
              ? `${total - doneCount} today • ${upcomingCount} scheduled`
              : `${total - doneCount} remaining today`;
          } else {
            const week = getWeekByOffset(taskWeekOffset);
            const keys = new Set(week.map((d) => d.key));
            const wkTasks = state.tasks.filter((t) => keys.has(t.date));
            const wkDone = wkTasks.filter((t) => t.done).length;
            document.getElementById("pageSubtitle").textContent =
              `${wkDone} / ${wkTasks.length} done this week`;
          }
        }

        // Render Today View + Snoopy
        if (taskMode === "today") {
          const stage = document.getElementById("snoopyStage");
          const stageWidth = stage.clientWidth || 320;
          const maxWalkPx = Math.max(0, stageWidth - 96);
          const snoopyX = 8 + ratio * maxWalkPx;

          const walker = document.getElementById("snoopyWalker");
          const trackFill = document.getElementById("snoopyTrackFill");
          walker.style.left = `${snoopyX}px`;
          trackFill.style.width = `${ratio * maxWalkPx}px`;

          if (lastTaskCountDone !== -1 && doneCount !== lastTaskCountDone) {
            walker.classList.remove("walking");
            void walker.offsetWidth;
            walker.classList.add("walking");
          }
          lastTaskCountDone = doneCount;
          walker.classList.toggle(
            "celebrate",
            total > 0 && doneCount === total,
          );

          const filtered = todayTasks.filter((t) =>
            taskFilter === "all"
              ? true
              : taskFilter === "active"
                ? !t.done
                : t.done,
          );

          const list = document.getElementById("tasksList");
          if (!filtered.length) {
            list.innerHTML = `<div class="empty">${total ? "No tasks in this filter." : "No tasks yet today. Type above and tap +."}</div>`;
          } else {
            list.innerHTML = filtered
              .map(
                (t) => `
            <div class="task-item">
              <button class="check-circle ${t.done ? "done" : ""}" onclick="toggleTask('${t.id}')">${t.done ? "✓" : ""}</button>
              <div class="task-title ${t.done ? "done" : ""}">${escapeHtml(t.title)}</div>
              <button class="btn-danger" onclick="deleteTask('${t.id}')">×</button>
            </div>
          `,
              )
              .join("");
          }
        }

        // Render Week Scheduler View
        if (taskMode === "week") {
          const week = getWeekByOffset(taskWeekOffset);
          const weekKeys = week.map((d) => d.key);
          if (!weekKeys.includes(selectedTaskWeekDate)) {
            selectedTaskWeekDate = week[0].key;
          }

          const fmt = (d) =>
            d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
          document.getElementById("taskWeekRangeLabel").textContent =
            `${fmt(week[0].date)} – ${fmt(week[6].date)}`;

          document.getElementById("taskWeekStrip").innerHTML = week
            .map((d) => {
              const dayTasks = state.tasks.filter((t) => t.date === d.key);
              const openCount = dayTasks.filter((t) => !t.done).length;
              const isSel = d.key === selectedTaskWeekDate;
              return `
            <button
              class="task-day-cell ${isSel ? "selected" : ""} ${d.isToday ? "today" : ""}"
              onclick="selectTaskWeekDate('${d.key}')"
            >
              <span style="font-size:10px; opacity:0.85;">${d.label}</span>
              <span style="font-size:14px; font-weight:600;">${d.date.getDate()}</span>
              <span class="task-day-badge">${dayTasks.length ? (openCount ? openCount : "✓") : "·"}</span>
            </button>
          `;
            })
            .join("");

          const selObj = parseDayKey(selectedTaskWeekDate);
          const selNice =
            selectedTaskWeekDate === today
              ? "Today"
              : selObj.toLocaleDateString(undefined, {
                  weekday: "short",
                  month: "short",
                  day: "numeric",
                });
          document.getElementById("weekTaskInput").placeholder =
            `Add task for ${selNice}...`;

          // 7-day breakdown cards
          document.getElementById("taskWeekBreakdown").innerHTML = week
            .map((d) => {
              const dayTasks = state.tasks.filter((t) => t.date === d.key);
              const isSel = d.key === selectedTaskWeekDate;
              const headerTitle = d.isToday
                ? `Today · ${d.shortName} ${d.date.getDate()}`
                : `${d.shortName}, ${d.date.toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;

              return `
            <div class="week-day-group ${isSel ? "active-day" : ""}">
              <div class="week-day-header" onclick="selectTaskWeekDate('${d.key}', true)">
                <span class="mono" style="font-size:12px; font-weight:600; color:${d.isToday ? "var(--accent)" : "var(--text)"};">
                  ${headerTitle}
                </span>
                <span class="mono muted" style="font-size:11px;">
                  ${dayTasks.length ? `${dayTasks.filter((t) => t.done).length}/${dayTasks.length}` : "+ schedule"}
                </span>
              </div>
              ${
                dayTasks.length
                  ? dayTasks
                      .map(
                        (t) => `
                <div class="task-item" style="padding:9px 2px;">
                  <button class="check-circle ${t.done ? "done" : ""}" onclick="toggleTask('${t.id}')">${t.done ? "✓" : ""}</button>
                  <div class="task-title ${t.done ? "done" : ""}" style="font-size:14px;">${escapeHtml(t.title)}</div>
                  <button class="btn-danger" onclick="deleteTask('${t.id}')">×</button>
                </div>
              `,
                      )
                      .join("")
                  : isSel
                    ? `<div class="mono muted" style="font-size:12px; padding:4px 0;">Type above to schedule for this day.</div>`
                    : ""
              }
            </div>
          `;
            })
            .join("");
        }
      }

      window.shiftTaskWeek = (delta) => {
        taskWeekOffset += delta;
        const week = getWeekByOffset(taskWeekOffset);
        selectedTaskWeekDate =
          taskWeekOffset === 0 ? dayKey(new Date()) : week[0].key;
        renderTasks();
      };

      window.selectTaskWeekDate = (key, focusInput = false) => {
        selectedTaskWeekDate = key;
        renderTasks();
        if (focusInput) {
          const inp = document.getElementById("weekTaskInput");
          inp.scrollIntoView({ behavior: "smooth", block: "center" });
          setTimeout(() => inp.focus(), 120);
        }
      };

      window.addQuickTask = () => {
        const input = document.getElementById("quickTaskInput");
        const dateInput = document.getElementById("quickTaskDate");
        const title = input.value.trim();
        if (!title) return;

        const scheduledDate = dateInput.value || dayKey(new Date());
        state.tasks.unshift({
          id: crypto.randomUUID(),
          title,
          notes: "",
          done: false,
          date: scheduledDate,
        });
        input.value = "";
        dateInput.value = dayKey(new Date());
        save();
      };

      window.addWeekTask = () => {
        const input = document.getElementById("weekTaskInput");
        const title = input.value.trim();
        if (!title) return;
        state.tasks.unshift({
          id: crypto.randomUUID(),
          title,
          notes: "",
          done: false,
          date: selectedTaskWeekDate,
        });
        input.value = "";
        save();
      };

      window.toggleTask = (id) => {
        const t = state.tasks.find((x) => x.id === id);
        if (t) {
          t.done = !t.done;
          save();
        }
      };

      window.deleteTask = (id) => {
        state.tasks = state.tasks.filter((x) => x.id !== id);
        save();
      };

      /* ================= HABITS (WEEK / MONTH / YEAR) ================= */
      function renderHabits() {
        const summaryEl = document.getElementById("habitSummaryCard");
        const listEl = document.getElementById("habitsList");
        const periodLabelEl = document.getElementById("habitPeriodLabel");
        const today = new Date();
        const todayStr = dayKey(today);

        if (habitMode === "week") {
          const week = getWeekByOffset(habitWeekOffset);
          const weekKeys = new Set(week.map((d) => d.key));
          const fmt = (d) =>
            d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
          periodLabelEl.textContent = `${fmt(week[0].date)} – ${fmt(week[6].date)}`;

          let totalDone = 0;
          state.habits.forEach((h) => {
            totalDone += h.days.filter((k) => weekKeys.has(k)).length;
          });
          const pct = state.habits.length
            ? Math.round((totalDone / (state.habits.length * 7)) * 100)
            : 0;

          summaryEl.innerHTML = `
          <div class="row-between">
            <span class="serif" style="font-size:18px; font-weight:600;">${habitWeekOffset === 0 ? "This Week" : "Weekly Summary"}</span>
            <span class="mono" style="font-size:20px; font-weight:600; color:var(--accent);">${pct}%</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="mono muted" style="font-size:11px;">${totalDone} of ${state.habits.length * 7} check-ins</div>
        `;

          if (currentTab === "habits") {
            document.getElementById("pageSubtitle").textContent =
              `${pct}% (${habitWeekOffset === 0 ? "this week" : periodLabelEl.textContent})`;
          }

          if (!state.habits.length) {
            listEl.innerHTML = `<div class="empty">No habits yet. Add one above to track your progress.</div>`;
            return;
          }

          listEl.innerHTML = state.habits
            .map((h) => {
              const doneThisWeek = h.days.filter((k) => weekKeys.has(k)).length;
              return `
            <div class="card">
              <div class="row-between">
                <div>
                  <div class="serif" style="font-size:17px; font-weight:600;">${escapeHtml(h.title)}</div>
                  <div class="mono muted" style="font-size:11px; margin-top:2px;">${doneThisWeek} of 7 days</div>
                </div>
                <button class="btn-danger" onclick="deleteHabit('${h.id}')">Delete</button>
              </div>
              <div class="week-grid">
                ${week
                  .map((d) => {
                    const done = h.days.includes(d.key);
                    return `
                    <button class="day-btn ${done ? "done" : ""} ${d.isToday ? "today" : ""}"
                      onclick="toggleHabitDay('${h.id}', '${d.key}')">
                      <span>${d.label}</span>
                      <span>${done ? "✓" : d.date.getDate()}</span>
                    </button>`;
                  })
                  .join("")}
              </div>
            </div>
          `;
            })
            .join("");
          return;
        }

        if (habitMode === "month") {
          const target = new Date(
            today.getFullYear(),
            today.getMonth() + habitMonthOffset,
            1,
          );
          const year = target.getFullYear();
          const month = target.getMonth();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const firstOffset = (target.getDay() + 6) % 7; // Mon=0 .. Sun=6
          const monthPrefix = `${year}-${String(month + 1).padStart(2, "0")}-`;

          periodLabelEl.textContent = target.toLocaleDateString(undefined, {
            month: "long",
            year: "numeric",
          });

          let totalDone = 0;
          state.habits.forEach((h) => {
            totalDone += h.days.filter((k) => k.startsWith(monthPrefix)).length;
          });

          // Use elapsed days if viewing current month, full month otherwise
          const denomDays =
            year === today.getFullYear() && month === today.getMonth()
              ? today.getDate()
              : daysInMonth;
          const possible = state.habits.length * denomDays;
          const pct = possible
            ? Math.min(100, Math.round((totalDone / possible) * 100))
            : 0;

          summaryEl.innerHTML = `
          <div class="row-between">
            <span class="serif" style="font-size:18px; font-weight:600;">Monthly Pace</span>
            <span class="mono" style="font-size:20px; font-weight:600; color:var(--accent);">${pct}%</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="mono muted" style="font-size:11px;">${totalDone} check-ins across ${denomDays} ${denomDays === 1 ? "day" : "days"}</div>
        `;

          if (currentTab === "habits") {
            document.getElementById("pageSubtitle").textContent =
              `${pct}% in ${target.toLocaleDateString(undefined, { month: "short" })}`;
          }

          if (!state.habits.length) {
            listEl.innerHTML = `<div class="empty">No habits yet. Add one above to see monthly calendars.</div>`;
            return;
          }

          listEl.innerHTML = state.habits
            .map((h) => {
              const doneSet = new Set(
                h.days.filter((k) => k.startsWith(monthPrefix)),
              );
              const hPct = Math.min(
                100,
                Math.round((doneSet.size / denomDays) * 100),
              );
              let cells = "";
              for (let b = 0; b < firstOffset; b++) cells += `<div></div>`;
              for (let day = 1; day <= daysInMonth; day++) {
                const key = `${monthPrefix}${String(day).padStart(2, "0")}`;
                const done = doneSet.has(key);
                const isToday = key === todayStr;
                cells += `
              <button
                class="month-day-btn ${done ? "done" : ""} ${isToday ? "today" : ""}"
                onclick="toggleHabitDay('${h.id}', '${key}')"
              >${day}</button>
            `;
              }

              return `
            <div class="card">
              <div class="row-between">
                <div>
                  <div class="serif" style="font-size:17px; font-weight:600;">${escapeHtml(h.title)}</div>
                  <div class="mono muted" style="font-size:11px; margin-top:2px;">${doneSet.size} / ${daysInMonth} days · ${hPct}% pace</div>
                </div>
                <button class="btn-danger" onclick="deleteHabit('${h.id}')">Delete</button>
              </div>
              <div class="month-weekdays">
                <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
              </div>
              <div class="month-cal-grid">${cells}</div>
            </div>
          `;
            })
            .join("");
          return;
        }

        // YEAR VIEW
        const year = today.getFullYear() + habitYearOffset;
        const yearPrefix = `${year}-`;
        periodLabelEl.textContent = `${year}`;

        const startOfYear = new Date(year, 0, 1);
        const endOfYear = new Date(year, 11, 31);
        const totalDaysInYear =
          Math.round((endOfYear - startOfYear) / 86400000) + 1;
        const daysElapsed =
          year === today.getFullYear()
            ? Math.round(
                (new Date(year, today.getMonth(), today.getDate()) -
                  startOfYear) /
                  86400000,
              ) + 1
            : year < today.getFullYear()
              ? totalDaysInYear
              : 0;

        // Map dayKey -> number of habits completed that day
        const dailyCounts = {};
        let totalYearCheckins = 0;
        state.habits.forEach((h) => {
          h.days.forEach((k) => {
            if (k.startsWith(yearPrefix)) {
              dailyCounts[k] = (dailyCounts[k] || 0) + 1;
              totalYearCheckins++;
            }
          });
        });

        const activeDays = Object.keys(dailyCounts).length;
        const possibleYear = state.habits.length * daysElapsed;
        const yearPct = possibleYear
          ? Math.min(100, Math.round((totalYearCheckins / possibleYear) * 100))
          : 0;

        // Build 52-week ink heatmap aligned to Monday
        const startPad = (startOfYear.getDay() + 6) % 7;
        let heatCells = "";
        for (let p = 0; p < startPad; p++) {
          heatCells += `<div class="heat-cell" style="background:transparent;"></div>`;
        }
        for (let i = 0; i < totalDaysInYear; i++) {
          const d = new Date(year, 0, 1 + i);
          const k = dayKey(d);
          const c = dailyCounts[k] || 0;
          let lvl = "";
          if (c > 0 && state.habits.length) {
            const r = c / state.habits.length;
            lvl = r >= 0.85 ? "l4" : r >= 0.55 ? "l3" : r >= 0.25 ? "l2" : "l1";
          }
          heatCells += `<div class="heat-cell ${lvl}" title="${k}: ${c} done"></div>`;
        }

        summaryEl.innerHTML = `
        <div class="row-between">
          <span class="serif" style="font-size:18px; font-weight:600;">${year} Overview</span>
          <span class="mono" style="font-size:20px; font-weight:600; color:var(--accent);">${yearPct}%</span>
        </div>
        <div class="mono muted" style="font-size:11px; margin-top:4px;">
          ${totalYearCheckins} total check-ins · ${activeDays} active days
        </div>
        <div class="year-heatmap-scroll">
          <div class="year-heatmap">${heatCells}</div>
        </div>
      `;

        if (currentTab === "habits") {
          document.getElementById("pageSubtitle").textContent =
            `${yearPct}% in ${year}`;
        }

        if (!state.habits.length) {
          listEl.innerHTML = `<div class="empty">No habits yet. Add one above to track your year.</div>`;
          return;
        }

        const monthInitials = [
          "J",
          "F",
          "M",
          "A",
          "M",
          "J",
          "J",
          "A",
          "S",
          "O",
          "N",
          "D",
        ];
        listEl.innerHTML = state.habits
          .map((h) => {
            const yearDays = h.days.filter((k) => k.startsWith(yearPrefix));
            const hYearPct = daysElapsed
              ? Math.min(100, Math.round((yearDays.length / daysElapsed) * 100))
              : 0;

            const barsHtml = monthInitials
              .map((lbl, mIdx) => {
                const mPrefix = `${year}-${String(mIdx + 1).padStart(2, "0")}-`;
                const mDaysTotal = new Date(year, mIdx + 1, 0).getDate();
                const mDone = yearDays.filter((k) =>
                  k.startsWith(mPrefix),
                ).length;
                const mPct = Math.round((mDone / mDaysTotal) * 100);
                return `
            <div class="year-bar-col" title="${lbl}: ${mDone}/${mDaysTotal}">
              <div class="year-bar-track">
                <div class="year-bar-fill" style="height:${mPct}%"></div>
              </div>
              <span class="year-bar-label">${lbl}</span>
            </div>
          `;
              })
              .join("");

            return `
          <div class="card">
            <div class="row-between">
              <div>
                <div class="serif" style="font-size:17px; font-weight:600;">${escapeHtml(h.title)}</div>
                <div class="mono muted" style="font-size:11px; margin-top:2px;">${yearDays.length} days completed · ${hYearPct}% pace</div>
              </div>
              <button class="btn-danger" onclick="deleteHabit('${h.id}')">Delete</button>
            </div>
            <div class="year-bars">${barsHtml}</div>
          </div>
        `;
          })
          .join("");
      }

      window.shiftHabitPeriod = (delta) => {
        if (habitMode === "week") habitWeekOffset += delta;
        else if (habitMode === "month") habitMonthOffset += delta;
        else habitYearOffset += delta;
        renderHabits();
      };

      window.addQuickHabit = () => {
        const input = document.getElementById("quickHabitInput");
        const val = input.value.trim();
        if (!val) return;
        state.habits.push({ id: crypto.randomUUID(), title: val, days: [] });
        input.value = "";
        save();
      };

      window.toggleHabitDay = (id, key) => {
        const h = state.habits.find((x) => x.id === id);
        if (!h) return;
        const idx = h.days.indexOf(key);
        if (idx >= 0) h.days.splice(idx, 1);
        else h.days.push(key);
        save();
      };

      window.deleteHabit = (id) => {
        state.habits = state.habits.filter((x) => x.id !== id);
        save();
      };

      /* ================= BACKUP & NAVIGATION ================= */
      window.toggleBackupPanel = () => {
        document.getElementById("backupPanel").classList.toggle("open");
      };

      window.exportData = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `footnotes-backup-${dayKey(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      window.importData = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed.habits && parsed.tasks && parsed.journal) {
              state = parsed;
              toggleBackupPanel();
              save();
            }
          } catch {
            alert("Invalid backup file.");
          }
        };
        reader.readAsText(file);
      };

      function escapeHtml(str) {
        return String(str).replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      }

      function render() {
        renderJournal();
        renderTasks();
        renderHabits();
        document
          .getElementById("journalBottomBar")
          .classList.toggle("show", currentTab === "journal");
      }

      // Main Bottom Tabs
      document.querySelectorAll("nav.tabs button").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentTab = btn.dataset.tab;
          document
            .querySelectorAll("nav.tabs button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          document
            .querySelectorAll(".view")
            .forEach((v) => v.classList.remove("active"));
          document.getElementById(`view-${currentTab}`).classList.add("active");

          const titles = {
            journal: "Field Notes",
            tasks: "Tasks",
            habits: "Habits",
          };
          const icons = { journal: "📖", tasks: "🐾", habits: "▤" };
          document.getElementById("pageTitle").textContent = titles[currentTab];
          document.getElementById("headerIcon").textContent = icons[currentTab];
          render();
        });
      });

      // Tasks Mode Switch (Today | Week)
      document.querySelectorAll("#taskModeSwitch button").forEach((btn) => {
        btn.addEventListener("click", () => {
          taskMode = btn.dataset.tmode;
          document
            .querySelectorAll("#taskModeSwitch button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          renderTasks();
        });
      });

      // Tasks Filter Switch (All | To Do | Done)
      document.querySelectorAll("#taskFilterSwitch button").forEach((btn) => {
        btn.addEventListener("click", () => {
          taskFilter = btn.dataset.filter;
          document
            .querySelectorAll("#taskFilterSwitch button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          renderTasks();
        });
      });

      // Habits Mode Switch (Week | Month | Year)
      document.querySelectorAll("#habitModeSwitch button").forEach((btn) => {
        btn.addEventListener("click", () => {
          habitMode = btn.dataset.hmode;
          document
            .querySelectorAll("#habitModeSwitch button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          renderHabits();
        });
      });

      // Top "Today" button resets whichever tab you are currently viewing
      document.getElementById("todayJumpBtn").addEventListener("click", () => {
        const todayStr = dayKey(new Date());
        if (currentTab === "journal") {
          selectedJournalDate = todayStr;
        } else if (currentTab === "tasks") {
          taskWeekOffset = 0;
          selectedTaskWeekDate = todayStr;
          document.getElementById("quickTaskDate").value = todayStr;
        } else if (currentTab === "habits") {
          habitWeekOffset = 0;
          habitMonthOffset = 0;
          habitYearOffset = 0;
        }
        render();
      });

      document.getElementById("monthLabelBtn").addEventListener("click", () => {
        selectedJournalDate = dayKey(new Date());
        renderJournal();
      });

      document
        .getElementById("backupToggleBtn")
        .addEventListener("click", toggleBackupPanel);
      window.addEventListener("resize", renderTasks);

      syncDailyTasks();
      render();
    </script>
  </body>
</html>
